<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Erreur interne du serveur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 10px;
        }
        .title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f1f5f9;
        }
        .message {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">500</div>
        <h1 class="title">Erreur interne du serveur</h1>
        <p class="message">
            Oups ! Quelque chose s'est mal passé de notre côté.<br>
            Nos équipes techniques ont été notifiées et résolvent le problème. Réessayez dans quelques instants !
        </p>
        <a href="/" class="btn">Retourner à l'accueil</a>
    </div>

</body>
</html>
